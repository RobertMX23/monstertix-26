title: Prompt your way to autonomy?
kicker: Step 2
minutes: 20
color: red
stage: 2
summary: >
  Attempting to enforce autonomous execution via prompt instructions fails
  regardless of wording.
parts:
  - id: a
    label: Talk to it
    headline: Prompts Can't Start Themselves
    body: a-talk.md
    expect:                 # what the ADK web UI and the venue show; top of the verify card
      - "`⚡ search_events({\"city\": \"Amsterdam\"})` ← tool execution"
      - "`✓ search_events` ← venue API response"
      - "Two Amsterdam shows: Tuesday 10 Nov and Saturday 14 ... ← model response"
      - "Agent graph showing `search_events`, `get_seatmap` and `purchase` tools"
    exercises:
      run:
        title: Talk to it
        intro: >
          Every step starts from the same world: 8 shows, all seats available,
          clock at 1×.
        tasks:
          - kind: prepare
            id: prepare
            step: 2
          - kind: turn
            id: turn
            items:
              - text: "In the **ADK web UI**, type:"
                say: I want to see The Midnight Signal. I'm in Amsterdam, going with Sam, budget around $200 each.
                in: agent
              - text: >
                  Click a **⚡** row. The left panel shows the arguments the model
                  picked. Click the **✓** underneath it for the JSON that came back.
              - text: >
                  The icons down the far-left edge switch what the panel shows. The
                  second one is the **agent graph** — try it and you should see
                  three tools.:
    checks:
      - id: searched
        label: The agent retrieved this data by executing the `search_events` tool, which queried the venue API.
        probe: python3 -m workbench.probe tool search_events
        hint: Ask about The Midnight Signal in Amsterdam, in a new session of the ADK web UI.

  - id: b
    label: The code
    headline: Open the code you just ran
    body: b-code.md
    exercises:
      code:
        title: Read the agent
        tasks:
          - kind: files
            id: files
            open: agent/concert/agent.py
            stage: 2
            compare: 1
            only: [agent/concert/]
            highlight: '^PROACTIVE_INSTRUCTION = |instruction=|Monitor the presale|Keep checking'
            highlightLabel: '`instruction=` is the text handed to the model on every turn; `PROACTIVE_INSTRUCTION` is the rewrite you will swap in.'

  - id: c
    label: Tell it not to sleep
    headline: So tell it not to sleep
    body: c-tell-it.md
    exercises:
      lab:
        title: Tell it the plan, exactly as you would tell a person
        intro: >
          Pick a wording, or write your own. Each swap edits
          `agent/concert/agent.py` and restarts the agent.
        tasks:
          - kind: prompts
            id: lab
            file: agent/concert/agent.py
            original: solutions/step2_asleep/concert/agent.py
            say: I want to see The Midnight Signal in Amsterdam with Sam. The presale opens at 10:00 on Tuesday. Grab us two tickets the moment it opens.
            prompts:
              - label: Monitor and act
                text: |
                  You are a proactive ticket-buying assistant.

                  Monitor the presale for The Midnight Signal. The moment it opens at 10:00 on
                  Tuesday, buy two tickets for the Amsterdam Saturday show — do not wait to be
                  asked, and do not wait for me to say anything. Act on your own.

                  Keep checking until the tickets are bought.
              - label: Set a timer
                text: |
                  You are a ticket-buying assistant.

                  Set a timer for 10:00 on Tuesday. When it goes off, buy two tickets for
                  The Midnight Signal at the Amsterdam Saturday show.
              - label: Check every five minutes
                text: |
                  You are a ticket-buying assistant.

                  Check every five minutes whether the presale for The Midnight Signal has
                  opened. As soon as it has, buy two tickets for the Amsterdam Saturday show.
              - label: Act autonomously
                text: |
                  You are an autonomous agent. Act autonomously without waiting for user
                  input.

                  Your goal: two tickets for The Midnight Signal, Amsterdam, Saturday, bought
                  as soon as the presale opens at 10:00 on Tuesday.
              - label: Wake yourself up
                text: |
                  You are a ticket-buying assistant that never sleeps.

                  After every reply, wake yourself up again and check the presale. Keep doing
                  this until two tickets for The Midnight Signal in Amsterdam on Saturday are
                  bought.
    checks:
      - id: swapped
        label: You swapped a proactive prompt in, and the agent restarted on it
        probe: python3 -m workbench.probe prompts --at-least 1
        hint: Pick a wording above and press **Swap it in and restart the agent**.
      - id: asleep
        label: No tickets were bought while you waited
        probe: python3 -m workbench.probe orders --count 0 --since-start agent
        expect: fail
        hint: >
          An order is on the panel. The agent bought inside the turn you typed.
          Swap in another wording and try again.
        note: >
          All fail for the same reason: prompts are read only when an invocation
          occurs. Without an external caller, no code is executed between turns.
