title: The Cloud Stack
kicker: Step 9
minutes: 30
color: blue
stage: 10
summary: >
  On your laptop, an agent depends on your computer staying awake, local
  SQLite databases, and local files. If you close your laptop lid or deploy to
  a cloud container that restarts, local files and memory disappear.
parts:
  - id: a
    label: Leaving the laptop
    headline: Laptops Sleep and Local Files Disappear
    body: a-leaving.md
    exercises:
      code:
        title: What changed
        intro: >
          Everything in this step is a new entrypoint, a container, and
          configuration.
        tasks:
          - kind: prepare
            id: prepare
            step: 10
          - kind: files
            id: files
            open: agent/main.py
            stage: 10
            compare: 9
            only: [agent/main.py, agent/Dockerfile, agent/requirements.txt, agent/monstertix/]
            highlight: 'os\.environ\.get\("SESSION_SERVICE_URI"|"SESSION_SERVICE_URI", f"sqlite|ARTIFACT_URI = os\.environ\.get|trigger_sources=\["pubsub"\]|@app\.post\("/trigger/wake"\)|budget\.mark_attended\(\)|web=False'
            highlightLabel: '`sqlite+aiosqlite:///…/sessions.db` became a Postgres URI, and `file://…/artifacts` became `gs://…`. `trigger_sources=["pubsub"]` mounts a route that speaks Pub/Sub''s push format, so the message arrives as an invocation. `/trigger/wake` finds the user''s existing parked session and resumes it. The `/wake` route the page posts to marks a person as present.'
    checks:
      - id: loaded
        label: Step 9 is loaded, with `/trigger/wake` in `agent/main.py`
        probe: python3 -m workbench.probe file agent/main.py trigger/wake
        hint: Press **Load step 9** above.

  - id: b
    label: Durable state
    headline: Three files that cannot come with you
    body: b-state.md
    exercises:
      state:
        title: Create them
        intro: >
          Provision a PostgreSQL database, database user, and Cloud Storage
          bucket. Note that Cloud SQL instance creation takes several minutes
          and was initiated in the background during `setup.sh`.
        tasks:
          - kind: turn
            id: turn-b
            items:
              - text: Collect it, and make the rest.
                run: ./setup-cloud-state.sh
    checks:
      - id: uris
        label: '`setup-cloud-state.sh` wrote the bucket''s artifact URI to `.env`'
        probe: python3 -m workbench.probe setting CLOUD_ARTIFACT_SERVICE_URI
        hint: Run `./setup-cloud-state.sh` above. If it says the instance is still being created, wait a few minutes and run it again.

  - id: c
    label: Deploy and wake
    headline: Now deploy, and give it an alarm clock
    body: c-deploy.md
    venue: true             # the live venue panel in a left column, as in step 1
    exercises:
      deploy:
        title: Now deploy, and give it an alarm clock
        intro: Three or four minutes. Start it and read on.
        tasks:
          - kind: turn
            id: turn-c
            items:
              - text: Copy the URL it prints after `→ agent`.
                run: ./deploy-agent.sh
      talk:
        title: Talk to it
        intro: >
          Open the agent's URL in a browser. The workbench only frames apps
          running on this machine.
        tasks:
          - kind: turn
            id: turn-c2
            items:
              - text: >
                  Ask it to book. **Watch it ask what you are willing to
                  spend**, exactly as it did on your laptop, and read the number
                  back before committing to it.
                say: Book me 3 tickets for The Midnight Signal in Tokyo. Best seats in the house, I don't want the cheap ones.
              - text: Answer the way you would out loud, then confirm.
                say: up to 250 a seat for the good ones
              - text: The run is parked in the queue right now, which is exactly the state 3am finds it in. So be 3am.
                say: Yes, that's right.
              - text: Press **SKIP THE WAIT** on the venue panel, so the queue is ready when the message arrives.
                press: SKIP THE WAIT
                venue: advance-queue
              - text: >
                  **To run it on a real schedule**, the job has to be enabled —
                  `jobs run` refuses on a paused one with `Job.state must be
                  ENABLED`.
                run: >-
                  bash -c 'gcloud scheduler jobs resume "presale-$(gcloud config get-value account 2>/dev/null | cut -d@ -f1 | tr "[:upper:]" "[:lower:]" | tr -c "a-z0-9-" "-" | sed "s/-*$//" | cut -c1-24)" --location=$REGION --project=$PROJECT'
              - text: Fire it now instead of waiting for 03:00 UTC. **Now watch the browser, and do not touch it.**
                run: >-
                  bash -c 'gcloud scheduler jobs run "presale-$(gcloud config get-value account 2>/dev/null | cut -d@ -f1 | tr "[:upper:]" "[:lower:]" | tr -c "a-z0-9-" "-" | sed "s/-*$//" | cut -c1-24)" --location=$REGION --project=$PROJECT'
              - text: "Within a few seconds the agent's reply appears on its own: it bought the tickets, at a price inside what you agreed, and told you so. Check the venue panel. **One order.**"
                look: venue
              - text: '**Pause it again when you are done.** An enabled job fires against your venue every night, or every five minutes if you set the impatient schedule below.'
                run: >-
                  bash -c 'gcloud scheduler jobs pause "presale-$(gcloud config get-value account 2>/dev/null | cut -d@ -f1 | tr "[:upper:]" "[:lower:]" | tr -c "a-z0-9-" "-" | sed "s/-*$//" | cut -c1-24)" --location=$REGION --project=$PROJECT'
      durable:
        title: Check the state is really durable
        intro: Do this part. It is the claim the whole step rests on.
        tasks:
          - kind: turn
            id: turn-c3
            items:
              - text: And the memory file, as an object in a bucket.
                run: >-
                  bash -c 'gcloud storage cat "$STATE_BUCKET/memory/userx.md" | head -20'
    checks:
      - id: order
        label: The venue has exactly one order
        probe: python3 -m workbench.probe orders --count 1
        hint: >
          Agree a budget in the deployed page, press SKIP THE WAIT, enable the
          job and fire it. No order usually means the job is paused or the run
          was not parked when it fired; two orders means a second run started.

  - id: d
    label: Clean up
    headline: Clean up
    body: d-clean-up.md
    exercises:
      destroy:
        title: Delete what you deployed
        intro: >
          These delete real cloud resources and cannot be undone. Skip this
          part if you want to keep working with the deployed agent or the
          venue.
        tasks:
          - kind: turn
            id: turn-d
            items:
              - text: Service, topic, subscription, scheduler job.
                run: ./destroy-agent.sh
              - text: Delete the venue. The venue panel and every step's checks that read it stop working after this.
                run: ./destroy-venue.sh
              - text: Notice those deliberately leave Cloud SQL and the bucket alone, because they hold your data and **both keep billing**. When you are certain you are finished.
                run: ./destroy-agent.sh --all
