title: Working With a Human
kicker: Step 8
minutes: 15
color: purple
stage: 9
summary: >
  Before executing high-stakes actions (like spending money on tickets), the
  agent must pause, ask the user to confirm their budget out loud, and save
  that explicit confirmation before making any purchases.
parts:
  - id: a
    label: The budget
    headline: Don't Spend Money Without Double-Checking with a Person
    body: a-the-budget.md
    exercises:
      code:
        title: What changed since the last step
        intro: >
          Open `agent/concert/budget.py` and read the whole thing.
        tasks:
          - kind: prepare
            id: prepare
            step: 9
          - kind: files
            id: files
            open: agent/concert/nightly.py
            stage: 9
            compare: 8
            only: [agent/concert/]
            highlight: '^def agree_budget|interrupt_id=|answers = getattr\(ctx, "resume_inputs"|ctx\.state\["budget"\] = said|edges=\[\(START, agree_budget|return str\(state\.get\("budget"\)'
            highlightLabel: '`nightly.py` has a new first node, `agree_budget`, which asks and reads back before anything else runs. `rerun_on_resume=True`, a **stable** `interrupt_id`, and `ctx.resume_inputs[id]`: where the answer lands.'

  - id: b
    label: Ask a person
    headline: The graph, one node longer
    body: b-ask.md
    venue: true             # the live venue panel in a left column, as in step 1
    expect:                 # what the ADK web UI and the venue show; top of the verify card
      - "The run **stops** on an `adk_request_input` event: *Before I book anything: what are you willing to spend?…*, with `{} State: request` holding your first message."
      - "After your answer it reads the number back before it commits: *So: <your words>. Have I got that right?*"
      - "After *Yes, that's right.*: four nodes ran off one word, and the **State** tab has **`budget`** — your sentence, verbatim. The run parks at `check_front`: `[check_front]  #14,203 — not yet. Pausing.`"
      - "After SKIP THE WAIT and `go`: woken again, and it does not ask twice. The venue panel: one order, inside what you agreed."
    exercises:
      run:
        title: Run it — step by step
        intro: >
          Reload the **ADK web UI** and pick the `concert` agent. Start a **new
          session** before the first message.
        tasks:
          - kind: turn
            id: turn
            items:
              - text: Ask for what you actually want.
                say: Get me and Sam two tickets to the Amsterdam show.
                in: agent
              - text: >
                  Answer the way people actually answer. In the **`Enter your
                  response...`** box — not the chat box at the bottom.
                answer: About a 100 for the cheap seats. 250 if they're the good ones.
                in: agent
              - text: Confirm it. Same box.
                answer: Yes, that's right.
                in: agent
              - text: >
                  Four nodes ran off one word. Open the **State** tab and find
                  **`budget`** — your sentence, verbatim.
              - text: Get to the front and finish.
                press: SKIP THE WAIT
                venue: advance-queue
              - text: Answer the newest `adk_request_input` — again in **its** box.
                answer: go
                in: agent
              - text: 'Check the **venue panel**: one order, at a price inside what you agreed for that kind of seat.'
                look: venue
    checks:
      - id: asked
        label: The graph started at `agree_budget`
        probe: python3 -m workbench.probe nodes agree_budget
        hint: Pick the `concert` agent, start a new session, and ask for two tickets to the Amsterdam show.
      - id: answered
        label: You answered a question in the event's own box
        probe: python3 -m workbench.probe pending --answered
        hint: Answer in the box on the event, not the chat box.
      - id: budget
        label: '`budget` in the State tab, in your own words'
        probe: python3 -m workbench.probe state budget
        hint: It is stored only after you confirm the read-back. Answer "Yes, that's right." in the second question's box.
      - id: order
        label: The venue has exactly one order
        probe: python3 -m workbench.probe orders --count 1
        hint: Press SKIP THE WAIT, then answer "go" in the newest event's box. Two orders usually means a message went to the main chat box and started a second run.

  - id: c
    label: How it asks
    headline: How a graph asks a person a question
    body: c-how.md
