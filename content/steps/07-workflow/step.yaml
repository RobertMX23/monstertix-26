title: Autonomous Workflow
kicker: Step 7
minutes: 20
color: teal
stage: 8
summary: 'ADK''s `Workflow` lets you make the fixed parts deterministic and keep an agent only where a
  decision genuinely needs one. Your agent is not replaced by any of this. It becomes the last node in
  that graph, with every tool, callback and idempotency key intact.

  '
parts:
- id: a
  label: Rules and judgement
  headline: LLMs Are Bad at Following Rigid Rules Every Single Time
  body: a-rules.md
  exercises:
    code:
      title: What changed since the last step
      intro: 'The dropdown still says `concert` — but what answers is no longer the agent you have been
        chatting with.

        '
      tasks:
      - kind: prepare
        id: prepare
        step: 8
      - kind: files
        id: files
        open: agent/concert/nightly.py
        stage: 8
        compare: 6
        only:
        - agent/concert/
        highlight: '^@node\(rerun_on_resume|^pick_show = node|^\s+return RequestInput\(|edges=\[\(START|^root_agent
          = nightly|^buyer_agent = Agent|^\s+before_tool_callback=|^def refresh_before_purchase|"Idempotency-Key":
          key'
        highlightLabel: Here, `root_agent` points to the `nightly` Workflow graph, with `buyer_agent`
          configured as the final node in the graph. `RequestInput` is an **interrupt**. `@node(rerun_on_resume=False)`
          keeps a wake-up from repeating `pick_show` and `queue_up`. `fence.py` is a callback ADK runs
          in the moment before any tool call. `purchase` now sends an `Idempotency-Key` header.
    run:
      title: Run the graph — three messages, in order
      intro: Send the same word every time and watch the graph change instead.
      tasks:
      - kind: turn
        id: turn-b
        items:
        - text: '**1. Notice what you are now talking to.** Reload the **ADK web UI**. The dropdown still
            says `concert` — but what answers is no longer the agent you have been chatting with.'
          look: agent
        - text: '**2. Start it.** In an automated workflow graph, initial execution starts without waiting
            for user input. Sending a message in `adk web` triggers the initial run.

            '
          say: go
          in: agent
        - text: '**Now look at the web browser.** The left panel draws the graph and colours in the nodes
            as they run. The right panel is the event stream, watched how the decisions are being made.
            Watch `queue_up` write **`queue_ticket`** and **`queue_event_id`** into session state.

            '
        - text: 'You should see a function call named `adk_request_input`, waiting for an answer. Then
            it goes quiet and the run ends. The graph reached `check_front`, found you 14,203rd, and stopped.
            Look for a process holding your place and find none.

            '
        - text: 'Check the **venue panel**: one queue ticket, and nothing running.'
          look: venue
        - text: '**3. Wake it up — and mind which box you type in.** Type anything into the **`Enter your
            response...`** box and press the arrow. Open the agent''s **log**, at the top right of the
            ADK web UI card.

            '
          answer: check
          in: agent
        - text: 'Check the **venue panel** again: still **one** ticket, and the position has dropped a
            little because the venue''s clock kept running while nothing of yours did. If you see `[open]`
            and `[pick_show]` run again, you typed in the chat box. Load step 7 again and start the step
            over.

            '
          look: venue
        - press: SKIP THE WAIT
          venue: advance-queue
          text: '**4. Get to the front, then finish.** Press **SKIP THE WAIT** on the venue panel.'
        - text: Answer the newest `adk_request_input` event one last time — again in **its** box, not
            the chat box.
          answer: check
          in: agent
        - text: 'This time watch `check_front` find you at the front and fall through. Watch the left
            panel light up `brief` and `concert`, the last two nodes.

            '
        - text: The venue panel shows one order, and no queue ticket left.
          look: venue
  checks:
  - id: ran
    label: '`open_the_night`, `pick_show`, `queue_up` and `check_front` ran'
    probe: python3 -m workbench.probe nodes open_the_night pick_show queue_up check_front
    hint: Start a new session in the ADK web UI and send "go".
  - id: oneticket
    label: The venue handed out exactly one queue ticket
    probe: python3 -m workbench.probe tickets --count 1
    hint: Two tickets means the graph queued twice. Load step 7 again and send `go` once, in a new session.
  - id: ticket
    label: '`queue_up` wrote `queue_ticket` into session state'
    probe: python3 -m workbench.probe state queue_ticket
    hint: The ticket is written when `queue_up` runs. Check that `pick_show` returned a plan.
  - id: parked
    label: The graph reached `check_front`, found you 14,203rd, and stopped
    probe: python3 -m workbench.probe pending
    hint: When `check_front` finds you are not at the front, it returns `RequestInput` and the run stops
      there.
  - id: answered
    label: You answered the interrupt in the `Enter your response...` box
    probe: python3 -m workbench.probe pending --answered
    hint: Use the box attached to the event, not the chat box at the bottom.
  - id: brief
    label: '`brief` and `concert` lit up'
    probe: python3 -m workbench.probe nodes brief concert
    hint: Press SKIP THE WAIT, then answer the newest `adk_request_input` event.
  - id: bought
    label: The venue holds exactly one order
    probe: python3 -m workbench.probe orders --count 1
    hint: No order means the buyer has not run yet. Two means a second run started; load step 7 again
      and answer only in the event's box.
  expect:
  - 'The left panel draws the graph and colours in the nodes as they run: `START`, `open_the_night`, `pick_show`,
    `queue_up` and `check_front` green. `brief` and `concert` stay grey.'
  - '`queue_up` writes **`queue_ticket`** and **`queue_event_id`** into session state.'
  - 'A function call named `adk_request_input`, waiting for an answer: *Still in the queue at #14,203.
    Wake me again and I will check.* The graph reached `check_front`, found you 14,203rd, and stopped.'
  - 'The venue panel: one queue ticket, and nothing running.'
  - 'After the first answer, one line in the agent''s log: `[check_front] #14,197 — not yet. Pausing.`
    It did not pick a second show and it did not take a second queue ticket.'
  - 'After SKIP THE WAIT and the second answer: `check_front` finds you at the front and falls through,
    and the left panel lights up `brief` and `concert`, the last two nodes.'
  - '**The graph is fully green, and the edges are counted.** The edges into `pick_show`, `queue_up` and
    `check_front` now carry a `2x` badge.'
  - 'The venue panel: one order, and one queue ticket, not 2.'
  venue: true
- id: b
  label: The graph
  headline: The graph
  body: b-graph.md
  exercises:
    graph:
      title: Read the graph
      tasks:
      - kind: files
        id: graph-files
        open: agent/concert/nightly.py
        stage: 8
        compare: 6
        only:
        - agent/concert/
        highlight: ^nightly = Workflow\(|edges=\[\(START|from \.agent import buyer_agent
        highlightLabel: '`nightly` is the graph: its edges run `open_the_night` to `buyer_agent`, and
          the last node is the agent you built, imported from `agent.py`.'
