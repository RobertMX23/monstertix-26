title: Process Resumption
kicker: Step 6
minutes: 15
color: amber
stage: 6
summary: 'When an agent has to wait in a 40-minute ticket queue, keeping a Python process alive and waiting
  is fragile and expensive.

  '
parts:
- id: a
  label: The wait
  headline: Waiting 40 Minutes Without Staying Online
  body: a-the-wait.md
  exercises:
    code:
      title: Move to this step's code
      intro: '`join_queue` returns straight away with a ticket instead of blocking, and `ResumabilityConfig`
        lets the run pause on it and pick up afterwards.

        '
      tasks:
      - kind: prepare
        id: prepare
        step: 6
      - kind: files
        id: files
        open: agent/concert/agent.py
        stage: 6
        compare: 5
        only:
        - agent/concert/
        highlight: LongRunningFunctionTool|ResumabilityConfig|def join_queue|def check_queue
        highlightLabel: '`LongRunningFunctionTool(func=join_queue)`: the tool returns without finishing.
          `ResumabilityConfig(is_resumable=True)`: the run may pause and be picked up.'
    run:
      title: Kill the agent
      intro: 'Start a **new session** in the ADK web UI before the first message.

        '
      tasks:
      - kind: turn
        id: turn
        items:
        - text: Ask the agent to buy. It calls `recall`, then `search_events`, then `join_queue`.
          say: Get me and Sam two tickets to the Amsterdam show.
          in: agent
        - text: 'Notice it picked **Saturday** without asking you. There are two Amsterdam shows, the
            10th is a Tuesday, and the memory file from the last step says Sam does not do weeknights.
            If it asks which show instead, it skipped `recall`; tell it.

            '
          say: The Saturday one, please.
          in: agent
        - text: 'Look at the control panel. The banner reads: *Agent is waiting in line — #14,203. About
            2400s at 1×. Safe to kill the agent right now — it will still be here.*'
          look: venue
        - text: Kill the agent. kill -9 and Ctrl-C both work.
          service: agent
          action: kill
        - text: Start it again.
          service: agent
          action: start
        - text: In the same session, ask the agent where it is in line.
          say: Where am I in line?
          in: agent
  checks:
  - id: joined
    label: It called `join_queue`
    probe: python3 -m workbench.probe tool join_queue
    hint: Ask the agent for two tickets to the Amsterdam show, in a new session.
  - id: saturday
    label: It picked **Saturday** (`ms-ams-01`) without asking you
    probe: python3 -m workbench.probe tool join_queue
    contains: ms-ams-01
    hint: There are two Amsterdam shows, the 10th is a Tuesday, and the memory file from the last step
      says Sam does not do weeknights. If it picked the Tuesday, reload step 6 and try again.
  - id: killed
    label: The agent was killed, and started again
    probe: python3 -m workbench.probe killed agent --restarted
    hint: Use **kill -9** at the top right of the ADK web UI card (Ctrl-C is fine too), then switch the
      agent back on.
  - id: dropped
    label: The position kept dropping while nothing was running
    probe: python3 -m workbench.probe queue
    hint: In the same session, ask the agent where it is in line.
  - id: once
    label: It did not join the queue a second time
    probe: python3 -m workbench.probe tool join_queue --exactly 1
    hint: Replaying would mean a second `join_queue` call, a second ticket, and a place at the back of
      a queue of 14,203 people. Load step 6 again and repeat in one session.
  expect:
  - '`You are in the queue for The Midnight Signal at Ziggo Dome, Amsterdam, on Saturday, November 14.
    Your position is 14203.`'
  - 'The control panel''s banner reads: `Agent is waiting in line — #14,203` / `About 2400s at 1×. Safe
    to kill the agent right now — it will still be here.`'
  - 'After the restart, *Where am I in line?*: `You are currently at position 12982 in the queue. It is
    not your turn yet.` It did not search the tour again, and it did not join the queue a second time.'
  venue: true
