title: Managing Context Lifetime
kicker: Step 4
minutes: 20
color: cyan
stage: 4
summary: 'An agent stores facts in several places: in the chat conversation, in session state, in files
  (artifacts), or in long-term user memory. Each place lasts for a different amount of time.

  '
parts:
- id: a
  label: Four places
  headline: Information Lives in Different Places for Different Times
  body: a-four-places.md
  exercises:
    code:
      title: Load the code
      tasks:
      - kind: prepare
        id: prepare
        step: 4
      - kind: files
        id: files
        open: agent/concert/tools.py
        stage: 4
        compare: 2
        only:
        - agent/concert/
        highlight: tool_context\.(save_artifact|state\["(temp:seatmap|user:prefs)"\] =)|class MarkdownMemoryService|async
          def search_memory|MEMORY_(DIR|USER) =
        highlightLabel: '`get_seatmap` saves the full map as an artifact and a summary to `temp:seatmap`,
          `note_companion` writes `user:prefs`, and `memory.py` puts long-term memory in a Markdown file.'
- id: b
  label: Memory store
  headline: Our memory store
  body: b-services.md
  exercises:
    run:
      title: Three messages, then look in four places
      intro: Click **New Session** in the top bar.
      tasks:
      - kind: turn
        id: turn
        items:
        - text: Say three things, one after the other.
          say: Sam can't do weeknights, by the way.
          in: agent
        - say: Show me the seat map for the Amsterdam Saturday show.
          in: agent
        - text: 'That third message matters. It ends the turn that read the seat map, and ending a turn
            is what makes `temp:` disappear.

            '
          say: Actually, hold that thought — what else is on in Amsterdam?
          in: agent
        - text: 'Now check. The **State** tab and the **Artifacts** tab are on the left of `adk web`.

            '
          look: agent
        - text: Open the **Artifacts** tab.
          look: agent
        - text: 'Switch to `two-days-ago` in the session dropdown at the top. Look at the **event stream**
            (the middle column). Look at the **State** tab.

            '
          look: agent
        - text: 'Open `memory/userx.md` in the file explorer below. The seat map is under `artifacts/`;
            press ↻ if it is not listed yet.

            '
      - kind: files
        id: memory
        open: memory/userx.md
        only:
        - memory/
        - artifacts/
        expand:
        - artifacts/
  checks:
  - id: noted
    label: The agent recorded Sam with `note_companion`
    probe: python3 -m workbench.probe tool note_companion
    contains: weeknight
    hint: In a new session, say "Sam can't do weeknights, by the way."
  - id: prefs
    label: '`user:prefs` holds Sam''s weeknight rule'
    probe: python3 -m workbench.probe state user:prefs --contains weeknight
    hint: The State tab shows `user:prefs` once `note_companion` has run.
  - id: seatmap
    label: The agent read the Amsterdam Saturday seat map
    probe: python3 -m workbench.probe tool get_seatmap
    contains: ms-ams-01
    hint: Ask for the seat map for the Amsterdam Saturday show.
  - id: artifact
    label: The full seat map was saved as a file in `artifacts/`
    probe: python3 -m workbench.probe artifacts
    contains: seatmap
    hint: '`get_seatmap` saves it. If the folder stays empty, check that step 4 is loaded: the agent''s
      switch only passes `--artifact_service_uri` from step 4 on.

      '
  - id: temp
    label: '`temp:seatmap` is not in the saved state'
    probe: python3 -m workbench.probe state temp:seatmap --absent --after-tool get_seatmap
    expect: fail
    hint: 'That third message matters. It ends the turn that read the seat map, and ending a turn is what
      makes `temp:` disappear.

      '
    note: 'State keys with a `temp:` prefix are strictly ephemeral and are never persisted to the database.

      '
  - id: memory
    label: The memory file says Sam bails on weeknights
    probe: python3 -m workbench.probe memory --contains weeknights
    hint: Load step 4 again; it copies a fresh `memory/userx.md` into place.
  expect:
  - 'After *Sam can''t do weeknights*: `⚡ note_companion`, then `✓ note_companion` with `{} State: user:prefs`,
    and a reply like *Got it. Sam can''t do weeknights.*'
  - 'After the seat map request: `⚡ get_seatmap("ms-ams-01")`, then `✓ get_seatmap` with `Artifact: seatmap_ms-ams-01.json`,
    and the prices: section A $210, B $145, C $95.'
  - '**State** tab: `user:prefs` with `Sam: "cannot do weeknights"`. In the **State** tab, notice that
    `temp:seatmap` is omitted.'
  - '**Artifacts** tab: `seatmap_ms-ams-01.json`, version 0.'
  - 'The `two-days-ago` session: older turns have been replaced by a summarized event block. Three kinds
    of key are sitting there together: `target_event_id`, `party_size` and `user:prefs`.'
- id: c
  label: Shelf life
  headline: Every fact has a shelf life
  body: d-shelf-life.md
