title: Event-Driven Dormancy
kicker: Step 3
minutes: 20
color: cyan
stage: 3
summary: 'Instead of keeping an agent running non-stop while it waits, a long-running agent should go
  completely dormant. An external event (such as a timer, a webhook, or a message) wakes the agent up
  only when there is actual work to do.

  '
parts:
- id: a
  label: The trigger
  headline: Agents Don't Stay Awake Forever
  body: a-dormant.md
  exercises:
    code:
      title: Load this step's code
      intro: 'Notice what that installed: `monstertix/`, holding the server, the clock, and one more thing
        you have not seen yet. Check that it left `agent/` alone, because nothing about the agent changes
        in this step. Hold onto that, it is the point.

        '
      tasks:
      - kind: prepare
        id: prepare
        step: 3
      - kind: files
        id: files
        open: monstertix/server.py
        stage: 3
        compare: 2
        only:
        - monstertix/
        highlight: ^runner = Runner\(|@app\.post\("/wake"\)|session_id or f"wake-|runner\.run_async\(|time\.sleep\(args\.|client\.post\(f"\{TRIGGER_URL\}/wake"
        highlightLabel: The server builds one `Runner` and runs the agent on each `POST /wake`; the clock
          sleeps, then makes that POST.
    start:
      title: Start it
      intro: So the same server also serves a page.
      tasks:
      - kind: turn
        id: turn-b
        items:
        - text: 'Start the Runner. Its log is at the top right of the MonsterTix card.

            '
          service: monstertix
          action: start
        - text: 'Say something to it, and watch MonsterTix''s log. Same `Runner`, same agent, same log
            lines. Only the caller changed.

            '
          say: What Amsterdam dates are there?
          in: monstertix
        - text: Try **+ New session** and **Reset memory**.
  checks:
  - id: listening
    label: MonsterTix is listening on port 8090
    probe: curl -s http://127.0.0.1:8090/health
    contains: concert
    hint: Switch MonsterTix on at the top right of its card.
  - id: page
    label: The page ran the agent through `POST /wake`
    probe: python3 -m workbench.probe session web-
    hint: Send a message from the MonsterTix page under the card.
- id: b
  label: The triggerer
  headline: The triggerer — something that knows the time
  body: c-triggerer.md
  venue: true
  exercises:
    fire:
      title: Fire once, 10 seconds from now
      tasks:
      - kind: turn
        id: turn-c
        items:
        - text: Fire once, 10 seconds from now.
          clock:
            in: 10
        - text: '**Now stop typing.** Hands down. Watch MonsterTix''s log.

            '
        - text: Check the **venue panel** and you should see the ticket's been bought.
          look: venue
        - text: 'Use `--every 30` if you want to see it repeat. Switch the clock off beside the button
            when you have watched it a couple of times.

            '
          clock:
            in: 5
            every: 30
  checks:
  - id: woken
    label: The clock called `/wake`, and the agent ran
    probe: python3 -m workbench.probe wake --clock
    hint: Start MonsterTix, then fire the clock.
  - id: wake-session
    label: The agent ran in a `wake-` session nobody typed into
    probe: python3 -m workbench.probe session wake-
    hint: Every fire of `clock.py` is a fresh wake. Fire the clock with MonsterTix running.
  - id: bought
    label: Tickets were bought with nobody at the keyboard
    probe: python3 -m workbench.probe orders
    hint: Look at MonsterTix's log. If the agent did not call `purchase`, fire the clock again.
