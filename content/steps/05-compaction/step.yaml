title: Context Degradation & Compaction
kicker: Step 5
minutes: 20
color: purple
stage: 5
summary: 'When a conversation gets too long, the system summarizes older messages to save space and tokens.

  '
parts:
- id: a
  label: Compaction
  headline: Summaries Forget the Details
  body: a-summary.md
  exercises:
    code:
      title: Move to this step's code
      intro: '`agent.py` no longer ends with `root_agent`.

        '
      tasks:
      - kind: prepare
        id: prepare
        step: 5
      - kind: files
        id: files
        open: agent/concert/agent.py
        stage: 5
        compare: 4
        only:
        - agent/concert/
        highlight: app = App\(|EventsCompactionConfig\(|compaction_interval=|overlap_size=|include_contents="none"|output_key=|AgentTool\(agent=budget_split
        highlightLabel: '**`compaction_interval=3`** means ADK summarises after every three turns. `include_contents="none"`
          means this agent is handed **none** of the conversation. **`output_key="budget_plan"`** puts
          the answer into session state under that name instead of leaving it loose in the conversation.'
- id: b
  label: The second agent
  headline: The second agent
  body: b-second-agent.md
- id: c
  label: Run it
  headline: Run it
  body: c-run-it.md
  expect:
  - 'In the **State** tab: `budget_plan`, holding the arithmetic agent''s full answer.'
  - 'After you change the numbers: `budget_plan` has been **overwritten**, not appended to.'
  - '**Tickets bought**: `1`, and *correct — one booking, one order*.'
  - 'The order underneath: `ord_xxxxxxxx — 8× section C · 760`.'
  - '**The tour**, Amsterdam Saturday: section C is down by 8.'
  exercises:
    run:
      title: Have a real conversation
      intro: 'Give compaction something to compress. It fires every three turns, so talk for five or six:
        where, who is coming, how many, and how much. The arithmetic goes to `budget_split`, which keeps
        its answer in `budget_plan`. Then read the summary ADK wrote for the early turns, and see what
        it kept.


        Start a **New Session** and have a real conversation. Five or six turns. This one works:

        '
      tasks:
      - kind: turn
        id: turn-c
        items:
        - say: hello
          in: agent
        - say: what's on in Amsterdam?
          in: agent
        - say: Sam is coming with us, and he can't do weeknights
          in: agent
        - say: there are 4 of us and I can spend about $200 a head. What fits?
          in: agent
        - text: Open the **State** tab. Find `budget_plan` there, holding the arithmetic agent's full
            answer.
          look: agent
        - text: Now change the numbers on it.
          say: what if 10 people come and I can only do $120 each?
          in: agent
        - text: Look at `budget_plan` again. It has been **overwritten**, not appended to. It's because
            `output_key` holds the latest one.
          look: agent
        - text: Somewhere in those turns, ADK summarised the earlier ones. Read it directly.
          run: ./show-compaction.sh
    book:
      title: Give it nothing new
      apps: []                # same session: uses the ADK web UI framed above
      intro: 'Do not start a new one — the summary you just read lives in *this* session''s events, and
        that is the only reason the agent still knows anything about Amsterdam.

        '
      tasks:
      - kind: turn
        id: turn-d
        items:
        - text: Give it nothing new.
          say: Book us something.
          in: agent
        - text: Answer it and let the booking go through.
          say: Amsterdam Saturday, section C, 8 people
          in: agent
        - text: Confirm it.
          say: 'yes'
          in: agent
        - text: Switch to the **venue panel**. Do not take the agent's word for it.
          look: venue
  checks:
  - id: split
    label: The main agent called `budget_split` like any other tool
    probe: python3 -m workbench.probe tool budget_split
    hint: Ask "there are 4 of us and I can spend about $200 a head. What fits?"
  - id: overwritten
    label: '`budget_plan` has been overwritten with the 10-person, $120 plan'
    probe: python3 -m workbench.probe state budget_plan
    contains: '120'
    hint: Ask "what if 10 people come and I can only do $120 each?" in the same session.
  - id: compacted
    label: ADK summarised the earlier turns
    probe: python3 -m workbench.probe compaction
    hint: Compaction fires after three turns. Keep talking for another few turns.
  - id: order
    label: The venue has an order for 8 seats
    probe: python3 -m workbench.probe orders --qty 8
    hint: 'Answer "Amsterdam Saturday, section C, 8 people", then "yes", and check the venue panel on
      the left.

      '
  venue: true
